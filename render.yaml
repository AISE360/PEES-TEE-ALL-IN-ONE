services:
  - type: web
    name: pees-tee-backend
    env: node
    plan: free
    buildCommand: npm install --workspace backend && npm --workspace backend run build
    startCommand: node backend/dist/index.js
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PROVIDER
        value: mock
      - key: CORS_ORIGIN
        value: "*"
  - type: web
    name: pees-tee-portal
    env: static
    buildCommand: npm install --workspace web-portal && npm --workspace web-portal run build
    staticPublishPath: web-portal/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: pees-tee-backend
          type: web
          property: host
